name: Clean Exchange Location Fix

on:
  push:
    paths:
      - .github/workflows/fix-exchange-location-close.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rebuild Exchange New from known-good source
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          base_sha = "5e6cadef4f3546e20429ac3629da2539c993a192"
          path = Path("app/exchange/new/page.tsx")
          text = subprocess.check_output(
              ["git", "show", f"{base_sha}:app/exchange/new/page.tsx"],
              text=True,
          )

          text = text.replace(
              '''type Region = {\n  code: string;\n  name: string;\n};\n''',
              '''type Region = {\n  code: string;\n  name: string;\n};\n\ntype ProfileLocation = {\n  province: string;\n  province_code: string;\n  city: string;\n  city_code: string;\n  district: string;\n  district_code: string;\n};\n''',
              1,
          )

          text = text.replace(
              '''  const [selectedProvince, setSelectedProvince] = useState("");\n  const [selectedCity, setSelectedCity] = useState("");\n  const [selectedDistrict, setSelectedDistrict] = useState("");\n''',
              '''  const [selectedProvince, setSelectedProvince] = useState("");\n  const [selectedCity, setSelectedCity] = useState("");\n  const [selectedDistrict, setSelectedDistrict] = useState("");\n  const [profileLoading, setProfileLoading] = useState(true);\n  const [useProfileLocation, setUseProfileLocation] = useState(true);\n  const [profileLocation, setProfileLocation] = useState<ProfileLocation>({\n    province: "",\n    province_code: "",\n    city: "",\n    city_code: "",\n    district: "",\n    district_code: "",\n  });\n''',
              1,
          )

          marker = '''\n  useEffect(() => {\n    async function loadProvinces() {'''
          profile_effect = '''\n  useEffect(() => {\n    if (!userId) return;\n\n    let mounted = true;\n\n    async function loadProfileLocation() {\n      setProfileLoading(true);\n\n      try {\n        const { data: profile, error: profileError } = await supabase\n          .from("profiles")\n          .select("province, province_code, city, city_code, district, district_code")\n          .eq("id", userId)\n          .single();\n\n        if (!mounted) return;\n        if (profileError || !profile) {\n          setUseProfileLocation(false);\n          return;\n        }\n\n        const location: ProfileLocation = {\n          province: profile.province || "",\n          province_code: profile.province_code || "",\n          city: profile.city || "",\n          city_code: profile.city_code || "",\n          district: profile.district || "",\n          district_code: profile.district_code || "",\n        };\n\n        setProfileLocation(location);\n\n        const complete = Boolean(\n          location.province_code && location.city_code && location.district_code\n        );\n        if (!complete) {\n          setUseProfileLocation(false);\n          return;\n        }\n\n        setSelectedProvince(location.province_code);\n        setSelectedCity(location.city_code);\n        setSelectedDistrict(location.district_code);\n        setUseProfileLocation(true);\n\n        const cityResponse = await fetch(\n          `/api/regions/regencies/${encodeURIComponent(location.province_code)}`,\n          { cache: "no-store" }\n        );\n        if (cityResponse.ok && mounted) {\n          const result = await cityResponse.json();\n          const data = Array.isArray(result?.data) ? result.data : Array.isArray(result) ? result : [];\n          setCities(data);\n        }\n\n        const districtResponse = await fetch(\n          `/api/regions/districts/${encodeURIComponent(location.city_code)}`,\n          { cache: "no-store" }\n        );\n        if (districtResponse.ok && mounted) {\n          const result = await districtResponse.json();\n          const data = Array.isArray(result?.data) ? result.data : Array.isArray(result) ? result : [];\n          setDistricts(data);\n        }\n      } catch (err) {\n        console.error("LOAD PROFILE LOCATION ERROR:", err);\n        if (mounted) setUseProfileLocation(false);\n      } finally {\n        if (mounted) setProfileLoading(false);\n      }\n    }\n\n    void loadProfileLocation();\n\n    return () => {\n      mounted = false;\n    };\n  }, [userId, supabase]);\n'''
          if marker not in text:
              raise SystemExit("province effect marker not found")
          text = text.replace(marker, profile_effect + marker, 1)

          text = text.replace(
              '''  async function handleProvinceChange(code: string) {\n    setSelectedProvince(code);''',
              '''  async function handleProvinceChange(code: string) {\n    setUseProfileLocation(false);\n    setSelectedProvince(code);''',
              1,
          )
          text = text.replace(
              '''  async function handleCityChange(code: string) {\n    setSelectedCity(code);''',
              '''  async function handleCityChange(code: string) {\n    setUseProfileLocation(false);\n    setSelectedCity(code);''',
              1,
          )

          toggle = '''\n  function handleProfileLocationToggle(checked: boolean) {\n    setUseProfileLocation(checked);\n    setError(null);\n\n    if (!checked) {\n      setSelectedProvince("");\n      setSelectedCity("");\n      setSelectedDistrict("");\n      setCities([]);\n      setDistricts([]);\n      return;\n    }\n\n    setSelectedProvince(profileLocation.province_code);\n    setSelectedCity(profileLocation.city_code);\n    setSelectedDistrict(profileLocation.district_code);\n\n    if (profileLocation.province_code) {\n      void fetch(`/api/regions/regencies/${encodeURIComponent(profileLocation.province_code)}`, { cache: "no-store" })\n        .then((response) => response.ok ? response.json() : null)\n        .then((result) => {\n          if (!result) return;\n          const data = Array.isArray(result?.data) ? result.data : Array.isArray(result) ? result : [];\n          setCities(data);\n        })\n        .catch((err) => console.error("LOAD PROFILE CITIES ERROR:", err));\n    }\n\n    if (profileLocation.city_code) {\n      void fetch(`/api/regions/districts/${encodeURIComponent(profileLocation.city_code)}`, { cache: "no-store" })\n        .then((response) => response.ok ? response.json() : null)\n        .then((result) => {\n          if (!result) return;\n          const data = Array.isArray(result?.data) ? result.data : Array.isArray(result) ? result : [];\n          setDistricts(data);\n        })\n        .catch((err) => console.error("LOAD PROFILE DISTRICTS ERROR:", err));\n    }\n  }\n'''
          marker = '''\n  function validateImage(file: File): boolean {'''
          if marker not in text:
              raise SystemExit("validate marker not found")
          text = text.replace(marker, toggle + marker, 1)

          text = text.replace(
              '''                  onChange={(e) => setSelectedDistrict(e.target.value)}''',
              '''                  onChange={(e) => {\n                    setUseProfileLocation(false);\n                    setSelectedDistrict(e.target.value);\n                  }}''',
              1,
          )

          lines = text.splitlines(True)
          class_marker = 'rounded-2xl border border-white/10 bg-white/[0.02] p-5 space-y-4'
          image_heading = next(i for i, line in enumerate(lines) if '"Foto Material"' in line and 'Material Images' in line)
          image_start = max(i for i in range(image_heading + 1) if class_marker in lines[i])
          location_heading = next(i for i, line in enumerate(lines) if '{t.common.location}' in line)
          location_start = max(i for i in range(location_heading + 1) if class_marker in lines[i])
          if location_start <= image_start:
              raise SystemExit("location section was not found after image section")

          depth = 0
          location_end = None
          for i in range(location_start, len(lines)):
              depth += lines[i].count("<div")
              depth -= lines[i].count("</div>")
              if i > location_start and depth == 0:
                  location_end = i + 1
                  break
          if location_end is None:
              raise SystemExit("location block end not found")

          location_block = lines[location_start:location_end]
          del lines[location_start:location_end]
          image_start = next(i for i, line in enumerate(lines) if class_marker in line)

          heading_idx = next(i for i, line in enumerate(location_block) if '{t.common.location}' in line)
          checkbox = [
              '\n',
              '            <label className="mb-5 flex cursor-pointer items-center gap-3">\n',
              '              <input\n',
              '                type="checkbox"\n',
              '                checked={useProfileLocation}\n',
              '                onChange={(e) => handleProfileLocationToggle(e.target.checked)}\n',
              '                disabled={profileLoading}\n',
              '                className="h-4 w-4 accent-emerald-300"\n',
              '              />\n',
              '              <span className="text-sm font-medium text-white">\n',
              '                {locale === "id" ? "Gunakan lokasi sesuai profil saya" : "Use my profile location"}\n',
              '              </span>\n',
              '            </label>\n',
          ]
          location_block[heading_idx + 1:heading_idx + 1] = checkbox
          lines[image_start:image_start] = location_block

          path.write_text(''.join(lines))

      - name: Validate production build
        run: |
          npm ci
          npm run build

      - name: Commit clean fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-exchange-location-close.yml
          git add app/exchange/new/page.tsx
          git commit -m "Fix Exchange location profile toggle"
          git push
